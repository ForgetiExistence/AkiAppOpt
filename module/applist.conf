#更多规则使用说明请参考 http://AppOpt.suto.top

# 支持数字范围：0-3,6-7
# 支持语义核心：e-core / p-core / hp-core / all-core
# 语义核心可与数字范围混合，例如 e-core,4

# 传统写法：将系统界面的渲染线程绑定到最高性能核心
# com.android.systemui{RenderThread}=hp-core

# 块写法：同一个应用的多条线程规则集中配置
# com.android.systemui {
#     RenderThread=hp-core
#     binder:*=e-core,p-core
# }

# 块首行可同时设置进程级规则
# com.example.app=all-core {
#     RenderThread=hp-core
#     Worker-*:100=e-core
# }

# :100 表示识别到应用 10 秒后生效（100 × 100 毫秒）

# 注意！上述规则仅作为用法参考实例
# 后续添加的规则请不要以#或//开头（这两种整行注释不会生效）
